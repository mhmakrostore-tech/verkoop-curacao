<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDER PICK KORSOU</title>
<style>
:root{font-family:Arial,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.head{background:#facc15;padding:18px;border-radius:16px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;font-size:28px}.panel,.card{background:white;border:1px solid #d1d5db;border-radius:14px;padding:16px;margin-bottom:12px}.card.new{border-left:8px solid #dc2626}.meta{color:#6b7280}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#111827;color:white}.btn.light{background:#e5e7eb;color:#111827}.btn.yellow{background:#facc15;color:#111827}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{background:#dc2626;color:#fff;border-radius:999px;padding:5px 10px;font-weight:900}.hidden{display:none!important}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 10px}.order-items{margin:12px 0;line-height:1.8}.order-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #e5e7eb}.order-detail.open{display:block}.mqs-title{font-size:28px;font-weight:900;text-align:center;margin:0 0 12px}.mqs-sep td{border-bottom:5px solid #111!important}.print-preview{display:none}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.repeat-customer th{font-size:18px;font-weight:900;border-bottom:2px solid #111;padding:8px 9px 12px}@media print{@page{margin:12mm} body *{visibility:hidden}.print-preview,.print-preview *{visibility:visible}.print-preview{display:block!important;position:absolute;left:0;top:0;width:100%;padding:18px}.no-print{display:none!important}}
</style></head><body><div class="wrap">
<div class="head"><div><h1>ORDER PICK KORSOU</h1><div>Alleen bestelbonnen openen en printen</div></div><div id="newBadge" class="badge hidden">0 NIEUW</div></div>
<div id="login" class="panel"><h2>Inloggen</h2><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Wachtwoord</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn">INLOGGEN</button><div id="loginMsg" class="meta"></div></div>
<div id="app" class="hidden"><div class="panel no-print"><div class="row"><button id="notifyBtn" class="btn yellow">🔔 Meldingen + geluid inschakelen</button><button id="logoutBtn" class="btn light">Uitloggen</button><span id="status" class="meta"></span></div></div><div id="orders"></div></div>
<div id="printPreview" class="print-preview"></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAzN8MArYYQhIdhKkZwAI0EiBZla57l-Jg",authDomain:"verkoop-curacao.firebaseapp.com",projectId:"verkoop-curacao",storageBucket:"verkoop-curacao.firebasestorage.app",messagingSenderId:"469707957925",appId:"1:469707957925:web:ab89dc2f2f04ea61188f4c"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let sales=[],initial=false,audioCtx=null;
const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function isRead(s){return s.pickRead===true||s.pickProcessed===true||s.pickStatus==='read'||!!s.pickReadAt}
function dateText(s){const d=s.createdAt?.toDate?.();return d?d.toLocaleString('nl-NL'):'Zojuist'}
function isMQS(i){return String(i.category||i.productCategory||'').trim().toUpperCase()==='MQS'}
function sortedItems(s){const a=[...(s.items||[])];return a.sort((x,y)=>(isMQS(y)?1:0)-(isMQS(x)?1:0))}
function hasMQS(s){return (s.items||[]).some(isMQS)}
function sound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.14;o.start();o.stop(audioCtx.currentTime+.2)}catch{}}
function notifyNew(list){if(!list.length)return;sound();if('Notification'in window&&Notification.permission==='granted'){new Notification('NIEUWE ORDER KORSOU',{body:list.length===1?(list[0].customerName||'Nieuwe bestelling'):`${list.length} nieuwe orders`})}}
async function markRead(id){try{await setDoc(doc(db,'sales',id),{pickRead:true,pickProcessed:true,pickStatus:'read',pickReadAt:serverTimestamp(),pickReadBy:auth.currentUser?.email||''},{merge:true})}catch(e){$('status').textContent='Gelezen status kon niet worden opgeslagen: '+e.message}}
function render(){const box=$('orders');const list=sales.filter(s=>!s.isCredit&&s.recordType!=='credit').sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));const unread=list.filter(s=>!isRead(s));$('newBadge').textContent=`${unread.length} NIEUW`;$('newBadge').classList.toggle('hidden',unread.length===0);box.innerHTML=list.length?'':'<div class="panel meta">Nog geen bestellingen.</div>';for(const s of list){const card=document.createElement('div');card.className='card '+(!isRead(s)?'new':'');const items=sortedItems(s).map(i=>`<div><strong>${safe(i.name||'')}</strong>${i.productCode?` · ${safe(i.productCode)}`:''} · ${safe(i.unitLabel||(i.unitType||'each').toUpperCase())} · <strong>${Number(i.qty||0)}</strong></div>`).join('');card.innerHTML=`<div class="row" style="justify-content:space-between"><div><strong>${safe(s.customerName||'Onbekende klant')}</strong><div class="meta">${safe(dateText(s))}</div></div>${!isRead(s)?'<span class="badge">NIEUW</span>':'<span class="meta">GEOPEND</span>'}</div><div id="d-${s.id}" class="order-detail"><div class="order-items">${items}</div>${s.note?`<div><strong>Notitie:</strong> ${safe(s.note)}</div>`:''}</div><div class="row no-print" style="margin-top:12px"><button class="btn light open" data-id="${s.id}">OPEN BON</button><button class="btn print" data-id="${s.id}">PRINT BON</button></div>`;box.appendChild(card)}box.querySelectorAll('.open').forEach(b=>b.onclick=async()=>{document.getElementById('d-'+b.dataset.id).classList.toggle('open');await markRead(b.dataset.id)});box.querySelectorAll('.print').forEach(b=>b.onclick=()=>printOrder(b.dataset.id))}
async function printOrder(id){const s=sales.find(x=>x.id===id);if(!s)return;const items=sortedItems(s);let lastMQS=items.reduce((n,i,idx)=>isMQS(i)?idx:n,-1);const rows=items.map((i,idx)=>`<tr class="${idx===lastMQS&&lastMQS<items.length-1?'mqs-sep':''}"><td>${safe(i.name||'')}</td><td>${safe(i.productCode||'')}</td><td>${safe(i.unitLabel||(i.unitType||'each').toUpperCase())}</td><td>${Number(i.qty||0)}</td></tr>`).join('');$('printPreview').innerHTML=`${hasMQS(s)?'<div class="mqs-title">MQS</div>':''}<h1>ORDER PICK KORSOU</h1><p><strong>Klant:</strong> ${safe(s.customerName||'Onbekende klant')}<br><strong>Datum:</strong> ${safe(dateText(s))}</p><table><thead><tr class="repeat-customer"><th colspan="4">${safe(s.customerName||'Onbekende klant')}</th></tr><tr><th>Product</th><th>Code</th><th>Eenheid</th><th>Aantal</th></tr></thead><tbody>${rows}</tbody></table>${s.note?`<p><strong>Notitie:</strong> ${safe(s.note)}</p>`:''}`;await markRead(id);window.print()}
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginMsg').textContent='Inloggen mislukt. Controleer e-mail en wachtwoord.'}};$('logoutBtn').onclick=()=>signOut(auth);$('notifyBtn').onclick=async()=>{sound();if('Notification'in window)await Notification.requestPermission();$('status').textContent=Notification.permission==='granted'?'Meldingen ingeschakeld':'Geluid ingeschakeld'};
onAuthStateChanged(auth,u=>{if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');onSnapshot(collection(db,'sales'),snap=>{const old=new Set(sales.map(x=>x.id));const next=snap.docs.map(d=>({id:d.id,...d.data()}));const added=initial?next.filter(x=>!old.has(x.id)&&!x.isCredit&&x.recordType!=='credit'):[];sales=next;render();if(initial)notifyNew(added);initial=true},e=>$('status').textContent='Orders laden mislukt: '+e.message)});
</script></body></html>
