<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verkoop Curaçao Beheerder</title>
<style>html,body{margin:0;height:100%;font-family:Arial;background:#f4f6fa}#bar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99999;background:white;padding:10px 14px;border-radius:14px;box-shadow:0 4px 16px #0002;display:flex;gap:10px;align-items:center}button{background:#ffcc00;border:0;border-radius:10px;padding:11px 16px;font-weight:800}iframe{border:0;width:100%;height:100%}</style></head>
<body><div id="bar"><button id="googleBtn">Inloggen met Google</button><span id="status">Log in als beheerder</span></div><iframe id="appFrame" src="./"></iframe>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAzN8MArYYQhIdhKKZwAI0EiBZla57l-Jg",authDomain:"verkoop-curacao.firebaseapp.com",projectId:"verkoop-curacao",storageBucket:"verkoop-curacao.firebasestorage.app",messagingSenderId:"469707957925",appId:"1:469707957925:web:ab89dc2f2f04ea61188f4c"};
const admins=["mh.makrostore@gmail.com","makro@maxiwholesale.com"],app=initializeApp(firebaseConfig),auth=getAuth(app),provider=new GoogleAuthProvider(),btn=document.getElementById("googleBtn"),status=document.getElementById("status"),bar=document.getElementById("bar"),frame=document.getElementById("appFrame");
provider.setCustomParameters({prompt:"select_account"});
btn.onclick=async()=>{status.textContent="Google-inloggen wordt geopend…";try{const r=await signInWithPopup(auth,provider),e=(r.user.email||"").toLowerCase();if(!admins.includes(e)){await signOut(auth);status.textContent="Dit account is geen beheerder.";return}status.textContent="Ingelogd. Beheerder wordt geopend…";frame.src="./?beheerder=1"}catch(e){status.textContent="Inloggen mislukt: "+(e.code||e.message)}};
onAuthStateChanged(auth,u=>{const e=(u?.email||"").toLowerCase();if(u&&admins.includes(e)){bar.style.display="none";frame.src="./?beheerder=1"}else bar.style.display="flex"});
</script></body></html>
